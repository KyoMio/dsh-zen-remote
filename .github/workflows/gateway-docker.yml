# Build and push the standalone gateway-server multi-arch Docker image to Docker Hub.
# Versioned independently from the root dsh-zen-remote plugin package:
#   - Automatic release on tag push matching `gateway-v*` (e.g. `gateway-v0.1.0`),
#     checked against gateway-server/package.json#version.
#   - Manual runs via workflow_dispatch (defaults to `edge` on branches).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub username (e.g. kyomio)
#   DOCKERHUB_TOKEN      Docker Hub Personal Access Token (Read & Write scope)
# Optional repository variable:
#   DOCKERHUB_REPOSITORY Target repository (default: <lowercase(DOCKERHUB_USERNAME)>/zr-gateway)
name: gateway-docker

on:
  push:
    tags: ['gateway-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom Docker image tag (optional; defaults to edge on branch runs)'
        required: false
        default: ''
      also_latest:
        description: 'Also update the :latest tag on this manual run'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Target platforms passed to buildx'
        required: false
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: gateway-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Check credentials and resolve image tags
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          INPUT_TAG: ${{ inputs.tag }}
          ALSO_LATEST: ${{ inputs.also_latest }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing secrets: please configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets." >&2
            exit 1
          fi

          raw_repo="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/zr-gateway}"
          image="$(printf '%s' "$raw_repo" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          tags=""
          append_tag() {
            local t="$1"
            if [ -n "$tags" ]; then
              tags="${tags}"$'\n'"${image}:${t}"
            else
              tags="${image}:${t}"
            fi
          }

          if [ -z "$INPUT_TAG" ] && [[ "$GITHUB_REF" == refs/tags/gateway-v* ]]; then
            pkg_ver="$(node -p "require('./gateway-server/package.json').version")"
            expected="gateway-v${pkg_ver}"
            if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "Tag $GITHUB_REF_NAME does not match gateway-server/package.json ($expected)" >&2
              exit 1
            fi
            append_tag "$pkg_ver"
            if [[ "$pkg_ver" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
              append_tag "${BASH_REMATCH[1]}"
              append_tag "latest"
            fi
          else
            if [ -n "$INPUT_TAG" ]; then
              append_tag "$INPUT_TAG"
            else
              append_tag "edge"
            fi
            if [ "$ALSO_LATEST" = "true" ]; then
              append_tag "latest"
            fi
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved image tags:"
          printf '%s\n' "$tags"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false

      - name: Build and push gateway-server image
        uses: docker/build-push-action@v7
        with:
          context: ./gateway-server
          file: ./gateway-server/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.target.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup pnpm & Node for release bundle
        if: startsWith(github.ref, 'refs/tags/gateway-v')
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: startsWith(github.ref, 'refs/tags/gateway-v')
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gateway-server/pnpm-lock.yaml

      - name: Pack & upload gateway hot-update bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/gateway-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm --dir gateway-server install --frozen-lockfile
          pnpm --dir gateway-server build
          bundle="/tmp/zen-remote-gateway-bundle.tar.gz"
          node gateway-server/scripts/pack-release.mjs --out "$bundle"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Gateway release $GITHUB_REF_NAME (Docker image + container hot-update bundle)."
          fi
          gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
