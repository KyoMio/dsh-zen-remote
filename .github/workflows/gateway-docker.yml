# Build and push the standalone gateway-server multi-arch Docker image to Docker Hub.
# Triggers on version tag pushes (v*) and manual workflow_dispatch runs.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME   Docker Hub username (e.g. kyomio)
#   DOCKERHUB_TOKEN      Docker Hub Personal Access Token (Read & Write scope)
# Optional repository variable:
#   DOCKERHUB_REPOSITORY Target repository (default: <lowercase(DOCKERHUB_USERNAME)>/zr-gateway)
name: gateway-docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom Docker image tag (optional; defaults to edge on branch runs)'
        required: false
        default: ''
      also_latest:
        description: 'Also update the :latest tag on this manual run'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Target platforms passed to buildx'
        required: false
        default: 'linux/amd64,linux/arm64'

concurrency:
  group: gateway-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check Docker Hub credentials and resolve image name
        id: target
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing secrets: please configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repository Actions secrets." >&2
            exit 1
          fi
          raw_repo="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/zr-gateway}"
          image="$(printf '%s' "$raw_repo" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Resolved target image: docker.io/$image"

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' && !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=raw,value=latest,enable=${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.also_latest) }}

      - name: Build and push gateway-server image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway-server
          file: ./gateway-server/Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
